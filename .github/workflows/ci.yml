name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false # 一个 OS 失败不取消另一个，便于对照
      matrix:
        include:
          # windows 托管 runner 无可用 WGL（wglCreateContextAttribsARB
          # not found，0.9.0 修复 PIPESTATUS 掩盖后确认）——GL 渲染测试
          # 仅在 ubuntu 跑；windows 保留仿真/分析/编码全量
          - { os: ubuntu-latest, kexpr: "not gpu_only" }
          - { os: windows-latest, kexpr: "not gpu_only and not hosted_runner_flaky" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # ubuntu 无显示环境：装 headless GL 系统库，
      # moderngl standalone context 经 EGL/Mesa 可用
      - name: Install headless GL (ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libosmesa6
      - name: Install (CPU-only extras; GPU extras need CUDA runners)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[qiskit,cpu-fallback,dev]
      - name: Lint
        run: |
          ruff check src tests examples benchmarks scripts
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          python -m pytest tests -q -k "${{ matrix.kexpr }}" --tb=short 2>&1 | tee pytest_output.txt
          exit ${PIPESTATUS[0]}
      - name: Failure diagnostics → step summary
        if: failure()
        run: |
          echo "### pytest 失败摘要（${{ matrix.os }}）" >> "$GITHUB_STEP_SUMMARY"
          tail -n 60 pytest_output.txt >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload test log (failure diagnostics)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.os }}
          path: pytest_output.txt
      # 无 NVIDIA GPU：NVENC/NV12 用例自带 skipif；cupy 用例模块级
      # importorskip 跳过；GPU 采样基准标记 gpu_only 不在 CI 跑。


  # 0.9.0 T3：C 内核（gpuqviz._core）双路径 parity 门禁——
  # 默认路径用编译出的扩展，disable 路径强制 numpy 回退，全套件各跑一遍
  core-parity:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu：全量套件（含 qiskit 交叉验证 1e-10 锁定 C 内核正确性）
          - { os: ubuntu-latest, core: "on",  kexpr: "not gpu_only" }
          - { os: ubuntu-latest, core: "off", kexpr: "not gpu_only" }
          # windows：跳过 hosted-runner WGL 波动测试（扩展编译仍被验证）；
          # 编码类真 bug 已修复（UTF-8 显式声明），无需跳过
          - { os: windows-latest, core: "on",  kexpr: "not gpu_only and not hosted_runner_flaky" }
          - { os: windows-latest, core: "off", kexpr: "not gpu_only and not hosted_runner_flaky" }
    runs-on: ${{ matrix.os }}
    env:
      GPUQVIZ_DISABLE_CORE: ${{ matrix.core == 'off' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install headless GL (ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libosmesa6
      - name: Install (编译扩展)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[qiskit,cpu-fallback,dev]
      - name: Verify core extension state
        shell: python
        run: |
          import importlib.util, os, sys
          if os.environ.get("GPUQVIZ_DISABLE_CORE"):
              spec = importlib.util.find_spec("gpuqviz._core")
              print("core disabled by env; spec:", spec)
          else:
              import gpuqviz._core as c
              print("core extension loaded:", c.__file__)
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          python -m pytest tests -q --tb=short             -k "${{ matrix.kexpr }}" 2>&1 | tee pytest_output.txt
          exit ${PIPESTATUS[0]}

  # S8: 无 GPU 环境可移植性回归门禁——强制 CPU 后端完整出片
  # （ubuntu runner 不装 CUDA/cupy，模拟零硬件用户的实际环境）
  cpu-portability:
    runs-on: ubuntu-latest
    env:
      GPUQVIZ_BACKEND: cpu
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU-only, no GPU extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[qiskit,cpu-fallback,dev]
      - name: CPU backend bell + heatmap video
        run: |
          python - <<'PY'
          import av, os
          from qiskit import QuantumCircuit
          from gpuqviz import render_bloch_video, render_heatmap_video
          from gpuqviz.backends import detect_backend
          assert detect_backend() == "cpu", f"expected cpu, got {detect_backend()}"
          qc = QuantumCircuit(2); qc.h(0); qc.cx(0, 1)
          # bell 2s@30fps
          out1 = render_bloch_video(circuit=qc, steps=20, fps=30, seconds=2,
                                     out="out/cpu_bell.mp4", backend="cpu")
          with av.open(str(out1)) as c:
              n1 = sum(1 for _ in c.decode(video=0))
          assert n1 == 60, f"bell: expected 60 frames, got {n1}"
          assert os.path.getsize(out1) > 1000
          # ghz heatmap 2s@30fps
          qc3 = QuantumCircuit(3); qc3.h(0); qc3.cx(0,1); qc3.cx(1,2)
          out2 = render_heatmap_video(circuit=qc3, steps=20, fps=30, seconds=2,
                                       out="out/cpu_heatmap.mp4", backend="cpu")
          with av.open(str(out2)) as c:
              n2 = sum(1 for _ in c.decode(video=0))
          assert n2 == 60, f"heatmap: expected 60 frames, got {n2}"
          assert os.path.getsize(out2) > 1000
          print(f"CPU portability: bell={n1}f, heatmap={n2}f — PASS")
          PY
