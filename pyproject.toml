[build-system]
requires = ["setuptools>=64", "wheel", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gpuqviz"
version = "0.9.0"
description = "GPU-accelerated quantum state evolution visualization and video rendering"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "gpuqviz contributors" }]
dependencies = [
    "numpy>=1.24",
    "moderngl>=5.10",
    "av>=15.1",
    "pydantic>=2.6",
    "typer>=0.12",
    "Pillow>=10.0",  # 静态帧 PNG 编码（render_frame）
]

[project.optional-dependencies]
gpu = [
    "cupy-cuda12x>=13.0",
    "pynvvideocodec>=2.0; python_version>='3.10'",  # 官方 wheel 仅支持 Py3.10+
]
qiskit = ["qiskit>=1.0", "qiskit-aer>=0.14"]
qiskit-gpu = ["qiskit>=1.0", "qiskit-aer-gpu>=0.14"]
pyqpanda = ["pyqpanda>=3.8"]
preview = ["moderngl-window>=2.4"]
plot = ["matplotlib>=3.8"]
cpu-fallback = ["numba>=0.59"]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "mypy", "matplotlib>=3.8"]

[project.scripts]
gpuqviz = "gpuqviz.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gpuqviz = [
    "assets/*",
    "assets/vendor/*",
    "_core.pyx",
    "_core.c",       # 预生成的 C 源（sdist 无 Cython 时仍可编译）
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# 0.5.0 发布基线：聚焦真实缺陷（E/F/W）；风格类规则（import 排序、
# 命名等）后续迭代再收紧。E501 行宽由编辑器/格式化器管理。
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
